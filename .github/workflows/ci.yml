```yaml
name: Build & Push Docker Images to Dockerhub

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FRONTEND_IMAGE_NAME: wanderblog-frontend
  BACKEND_IMAGE_NAME: wanderblog-backend

jobs:

# ==========================================
# Detect Changes
# ==========================================

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'

            backend:
              - 'server/**'

# ==========================================
# FRONTEND
# ==========================================

  frontend:
    name: Frontend — Test Build Push
    runs-on: ubuntu-latest
    needs: changes

    if: needs.changes.outputs.frontend == 'true'

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        timeout-minutes: 5
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate Tag
        id: tag
        run: |
          echo "next_tag=v${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.tag.outputs.next_tag }}

      - name: Update Frontend Manifest
        run: |
          sed -i \
          "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.tag.outputs.next_tag }}|" \
          kubernetes-manifests/frontend.yml

      - name: Commit Frontend Manifest
        run: |
          git config user.name "sandeshjamdar20"
          git config user.email "sandeshjamdar51@gmail.com"

          git add .

          git diff --cached --quiet || \
          git commit -m "update frontend image"

          git push

# ==========================================
# BACKEND
# ==========================================

  backend:
    name: Backend — Test Build Push
    runs-on: ubuntu-latest
    needs: changes

    if: needs.changes.outputs.backend == 'true'

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        timeout-minutes: 5
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate Tag
        id: tag
        run: |
          echo "next_tag=v${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.tag.outputs.next_tag }}

      - name: Update Backend Manifest
        run: |
          sed -i \
          "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.tag.outputs.next_tag }}|" \
          kubernetes-manifests/backend.yml

      - name: Commit Backend Manifest
        run: |
          git config user.name "sandeshjamdar20"
          git config user.email "sandeshjamdar51@gmail.com"

          git add .

          git diff --cached --quiet || \
          git commit -m "update backend image"

          git push
```
